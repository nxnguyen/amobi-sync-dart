name: amobi_sync_flutter
version: 1.18.0+amobi.7
homepage: https://powersync.com
repository: https://github.com/nxnguyen/amobi-sync-dart
description: PowerSync Flutter SDK. Sync Postgres, MongoDB or MySQL with SQLite in your Flutter app
environment:
  sdk: ^3.4.0

dependencies:
  # Needed because of sqlite3_flutter_libs
  flutter:
    sdk: flutter

  sqlite3_flutter_libs: ^0.5.39
  amobi_sync_core:
    path: ../powersync_core
  powersync_flutter_libs: 0.4.15+1
  collection: ^1.17.0
  http: ^1.5.0
  uuid: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.0
  path: ^1.8.3
  path_provider: ^2.0.13
  sqlite3: 2.9.4
  sqlite_async: ^0.13.1

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:
